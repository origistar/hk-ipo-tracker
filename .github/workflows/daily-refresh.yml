name: 每日刷新港股打新数据

on:
  schedule:
    # 北京时间 09:30 / 12:30 / 16:30 / 20:30 → UTC 01:30 / 04:30 / 08:30 / 12:30
    - cron: '30 1,4,8,12 * * *'
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 刷新行情并推送
        run: |
          node update.mjs
          node push.mjs
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
